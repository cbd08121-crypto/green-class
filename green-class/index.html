<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리 반 초록불 타임어택</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .status-image { width: 220px; height: 220px; object-fit: contain; margin-bottom: 10px; }
    .student-list { max-width: 600px; margin: 0 auto; text-align: left; }
    .student-item { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; }
    .student-left { display: flex; flex-direction: column; }
    .student-right { text-align: right; min-width: 180px; }
    .student-name.green { color: #0a8a3a; font-weight: bold; }
    .pledge { font-size: 0.8rem; opacity: 0.8; }
    .timer { font-size: 0.8rem; opacity: 0.7; }
    button { cursor: pointer; padding: 7px 12px; border-radius: 6px; }
    select { padding: 6px 8px; }
    .edit-btn { margin-top: 4px; padding: 4px 8px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <h1>우리 반 초록불 타임어택</h1>
  <img id="earthImage" class="status-image" src="earth_sad.png">
  <p id="earthText">아직 힘든 지구와 땀나라 아이들… 초록 약속이 더 필요해요.</p>

  <div>
    <select id="studentSelect">
      <option value="">내 이름을 선택하세요</option>
      <option value="1">1번 유주</option>
      <option value="2">2번 지오</option>
      <option value="3">3번 연서</option>
      <option value="4">4번 하진</option>
      <option value="5">5번 다인</option>
      <option value="6">6번 서윤</option>
      <option value="7">7번 지유</option>
      <option value="8">8번 서우</option>
      <option value="9">9번 하린</option>
      <option value="10">10번 민서</option>
      <option value="11">11번 기훈</option>
      <option value="12">12번 대훈</option>
      <option value="13">13번 승유</option>
      <option value="14">14번 유준</option>
      <option value="15">15번 관우</option>
      <option value="16">16번 태양</option>
      <option value="17">17번 재원</option>
      <option value="18">18번 은규</option>
      <option value="19">19번 선우</option>
      <option value="20">20번 지후</option>
    </select>
    <button id="greenBtn">오늘 초록 행동 했어요!</button>
  </div>

  <h2>우리 반 초록불 현황</h2>
  <div class="student-list" id="studentList"></div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCk7vWRNVN3AY8BXVnaMglVsiBrDTWo-CI",
      authDomain: "green-class-energy.firebaseapp.com",
      databaseURL: "https://green-class-energy-default-rtdb.firebaseio.com",
      projectId: "green-class-energy",
      storageBucket: "green-class-energy.firebasestorage.app",
      messagingSenderId: "898716867012",
      appId: "1:898716867012:web:e32fe841385ab91a45ec91"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ACTIVE_DURATION = 48 * 60 * 60 * 1000;

    const STUDENTS = {
      "1": "1번 유주", "2": "2번 지오", "3": "3번 연서",
      "4": "4번 하진", "5": "5번 다인", "6": "6번 서윤",
      "7": "7번 지유", "8": "8번 서우", "9": "9번 하린",
      "10": "10번 민서", "11": "11번 기훈", "12": "12번 대훈",
      "13": "13번 승유", "14": "14번 유준", "15": "15번 관우",
      "16": "16번 태양", "17": "17번 재원", "18": "18번 은규",
      "19": "19번 선우", "20": "20번 지후"
    };

    let dataCache = {};

    onValue(ref(db, "students"), snapshot => {
      dataCache = snapshot.val() || {};
      renderStudents();
    });

    document.getElementById("greenBtn").addEventListener("click", () => {
      const id = document.getElementById("studentSelect").value;
      if (!id) { alert("이름을 선택하세요!"); return; }

      const now = Date.now();
      const info = dataCache[id] || {};

      set(ref(db, "students/" + id), {
        name: STUDENTS[id],
        lastGreenTime: now,
        pledge: info.pledge || ""
      });
    });

    function renderStudents() {
      const list = document.getElementById("studentList");
      list.innerHTML = "";
      const now = Date.now();
      let greenCount = 0;

      Object.keys(STUDENTS).forEach(id => {
        const info = dataCache[id] || {};
        let isActive = false;
        let remaining = 0;

        if (info.lastGreenTime) {
          remaining = ACTIVE_DURATION - (now - info.lastGreenTime);
          if (remaining > 0) isActive = true;
        }

        if (isActive) greenCount++;

        const row = document.createElement("div");
        row.className = "student-item";

        const left = document.createElement("div");
        left.className = "student-left";

        const name = document.createElement("span");
        name.textContent = STUDENTS[id];
        name.className = isActive ? "student-name green" : "student-name";

        const pledge = document.createElement("span");
        pledge.className = "pledge";
        pledge.textContent = info.pledge ? `다짐: ${info.pledge}` : "다짐: 없음";

        left.appendChild(name);
        left.appendChild(pledge);

        const right = document.createElement("div");
        right.className = "student-right";

        const status = document.createElement("div");
        status.textContent = isActive ? "초록불 ON 🌱" : "꺼짐 ⚠️";

        const timer = document.createElement("div");
        timer.className = "timer";
        if (isActive) {
          const h = Math.floor(remaining / 3600000);
          const m = Math.floor((remaining % 3600000) / 60000);
          timer.textContent = `남은 시간: ${h}시간 ${m}분`;
        } else {
          timer.textContent = "다시 실천하면 켜져요!";
        }

        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.textContent = "다짐 수정";
        edit.onclick = () => {
          const newText = prompt(`${STUDENTS[id]}의 새 다짐`, info.pledge || "");
          if (newText !== null) {
            set(ref(db, "students/" + id + "/pledge"), newText);
          }
        };

        right.appendChild(status);
        right.appendChild(timer);
        right.appendChild(edit);

        row.appendChild(left);
        row.appendChild(right);
        list.appendChild(row);
      });

      updateEarth(greenCount);
    }

    function updateEarth(greenCount) {
      const total = Object.keys(STUDENTS).length;
      const half = Math.ceil(total / 2);
      const earthImage = document.getElementById("earthImage");
      const earthText = document.getElementById("earthText");

      if (greenCount >= half) {
        earthImage.src = "earth_happy.png";
        earthText.textContent = "우리 반이 지구와 아이들을 지키고 있어요!";
      } else {
        earthImage.src = "earth_sad.png";
        earthText.textContent = "아직 지구가 더워요… 더 많은 초록 약속이 필요해요!";
      }
    }

  </script>

</body>
</html>
