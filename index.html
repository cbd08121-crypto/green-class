<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리 반 초록불 페이지</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-image: url("bg_sad.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      padding: 24px;
      transition: background-image 0.6s ease-in-out;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #ffffffdd;
      backdrop-filter: blur(6px);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      padding: 20px 20px 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px 16px;
      border-bottom: 2px solid #f2f2f2;
      margin-bottom: 16px;
    }

    header .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe585, #ffb347);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    header p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: #666;
    }

    .top-area {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }

    /* 🔥 지구 카드 – 그림만 중앙 */
    .earth-card {
      flex: 1 1 260px;
      background: #fdfaf3;
      border-radius: 16px;
      padding: 16px 18px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #f3e1b9;
    }

    /* 🔥 지구 4배 확대 */
    .status-image {
      width: 640px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* 진행 상황 영역 */
    .progress-card {
      flex: 1 1 220px;
      background: #f5fbff;
      border-radius: 16px;
      padding: 12px 16px 14px;
      border: 1.5px solid #cfe8ff;
      text-align: left;
      font-size: 0.9rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #e6f2ff;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #39d98a, #20a86b);
      transition: width 0.4s ease;
    }

    #progressText {
      font-size: 1rem;
      color: #222;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 이름 선택 카드 */
    .controls-card {
      margin-bottom: 18px;
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 14px 12px;
      border: 1px solid #e7edf3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #d2d8e0;
      min-width: 180px;
      font-size: 0.9rem;
    }

    #greenBtn {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #3bd48b, #1ea96c);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(47, 181, 115, 0.4);
    }

    h2 {
      text-align: left;
      font-size: 1rem;
      margin: 0 0 8px;
    }

    .student-list {
      max-width: 100%;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #e7edf3;
      overflow: hidden;
    }

    /* 🔥 이름 + 다짐 1.5배 확대 */
    .student-item {
      display: flex;
      justify-content: space-between;
      padding: 18px 18px;
      border-top: 1px solid #f1f3f7;
      align-items: center;
      gap: 20px;
    }

    .student-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .student-name {
      font-size: 2.4rem; /* 원래 1.6rem → 1.5배 */
      font-weight: 800;
      color: #1c5f39;
    }

    .student-name.green {
      color: #168c4e;
    }

    .pledge {
      font-size: 3rem;  /* 원래 2rem → 1.5배 */
      font-weight: 900;
      color: #111;
      max-width: 100%;
      line-height: 1.4;
      word-break: keep-all;
    }

    .student-right {
      text-align: right;
      min-width: 200px;
      font-size: 1rem;
    }

    .timer {
      font-size: 0.85rem;
      color: #555;
    }

    .edit-btn {
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #d9e2ef;
      background: #f7fbff;
      font-size: 0.8rem;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="app">

    <header>
      <div class="icon-circle">🌍</div>
      <div>
        <h1>반짝반 초록불</h1>
        <p>지구와 땀나라 친구들을 지켜 주는 에너지 약속 페이지</p>
      </div>
    </header>

    <div class="top-area">
      <!-- 왼쪽: 지구 그림만 -->
      <div class="earth-card">
        <img id="earthImage" class="status-image" src="earth_sad.png">
      </div>

      <!-- 오른쪽: 진행 상황 -->
      <div class="progress-card">
        <div class="progress-header">
          <strong>우리 반 초록불 상황 🌱</strong>
          <span id="summaryText">0 / 0 명</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="progressText"></div>
      </div>
    </div>

    <div class="controls-card">
      <div>
        <span>👦👧 내 이름:</span>
        <select id="studentSelect">
          <option value="">이름을 선택하세요</option>
          <option value="1">1번 유주</option>
          <option value="2">2번 지오</option>
          <option value="3">3번 연서</option>
          <option value="4">4번 하진</option>
          <option value="5">5번 다인</option>
          <option value="6">6번 서윤</option>
          <option value="7">7번 지유</option>
          <option value="8">8번 서우</option>
          <option value="9">9번 하린</option>
          <option value="10">10번 민서</option>
          <option value="11">11번 기훈</option>
          <option value="12">12번 대훈</option>
          <option value="13">13번 승유</option>
          <option value="14">14번 유준</option>
          <option value="15">15번 관우</option>
          <option value="16">16번 태양</option>
          <option value="17">17번 재원</option>
          <option value="18">18번 은규</option>
          <option value="19">19번 선우</option>
          <option value="20">20번 지후</option>
        </select>
      </div>

      <button id="greenBtn">🌱 오늘 초록 행동 했어요!</button>
    </div>

    <h2>우리 반 초록불 약속 목록</h2>
    <div id="studentList" class="student-list"></div>

  </div>

  <!-- JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCk7vWRNVN3AY8BXVnaMglVsiBrDTWo-CI",
      authDomain: "green-class-energy.firebaseapp.com",
      databaseURL: "https://green-class-energy-default-rtdb.firebaseio.com",
      projectId: "green-class-energy",
      storageBucket: "green-class-energy.firebasestorage.app",
      messagingSenderId: "898716867012",
      appId: "1:898716867012:web:e32fe841385ab91a45ec91"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ACTIVE_DURATION = 24 * 60 * 60 * 1000;

    const STUDENTS = {
      "1": "1번 유주", "2": "2번 지오", "3": "3번 연서",
      "4": "4번 하진", "5": "5번 다인", "6": "6번 서윤",
      "7": "7번 지유", "8": "8번 서우", "9": "9번 하린",
      "10": "10번 민서", "11": "11번 기훈", "12": "12번 대훈",
      "13": "13번 승유", "14": "14번 유준", "15": "15번 관우",
      "16": "16번 태양", "17": "17번 재원", "18": "18번 은규",
      "19": "19번 선우", "20": "20번 지후"
    };

    let dataCache = {};

    const studentListDiv = document.getElementById("studentList");
    const earthImage = document.getElementById("earthImage");
    const greenBtn = document.getElementById("greenBtn");
    const selectEl = document.getElementById("studentSelect");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const summaryText = document.getElementById("summaryText");

    onValue(ref(db, "students"), snapshot => {
      dataCache = snapshot.val() || {};
      renderStudents();
    });

    greenBtn.addEventListener("click", () => {
      const id = selectEl.value;
      if (!id) {
        alert("먼저 이름을 선택해 주세요!");
        return;
      }
      const now = Date.now();
      const info = dataCache[id] || {};

      set(ref(db, "students/" + id), {
        name: STUDENTS[id],
        lastGreenTime: now,
        pledge: info.pledge || ""
      });
    });

    function renderStudents() {
      studentListDiv.innerHTML = "";
      const now = Date.now();
      let greenCount = 0;

      Object.keys(STUDENTS).forEach(id => {
        const info = dataCache[id] || {};
        let isActive = false;
        let remaining = 0;

        if (info.lastGreenTime) {
          remaining = ACTIVE_DURATION - (now - info.lastGreenTime);
          if (remaining > 0) isActive = true;
        }

        if (isActive) greenCount++;

        const row = document.createElement("div");
        row.className = "student-item";

        const left = document.createElement("div");
        left.className = "student-left";

        const name = document.createElement("span");
        name.textContent = STUDENTS[id];
        name.className = "student-name" + (isActive ? " green" : "");

        const pledge = document.createElement("span");
        pledge.className = "pledge";
        pledge.textContent =
          info.pledge ? `다짐: ${info.pledge}` : "다짐: 아직 정해지지 않았어요";

        left.appendChild(name);
        left.appendChild(pledge);

        const right = document.createElement("div");
        right.className = "student-right";

        const status = document.createElement("div");
        status.textContent = isActive ? "초록불 ON 🌱" : "꺼짐 ⚠️";

        const timer = document.createElement("div");
        timer.className = "timer";
        if (isActive) {
          const h = Math.floor(remaining / 3600000);
          const m = Math.floor((remaining % 3600000) / 60000);
          timer.textContent = `남음: ${h}시간 ${m}분`;
        } else {
          timer.textContent = "다시 실천하면 켜져요!";
        }

        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.textContent = "다짐 수정";
        edit.onclick = () => {
          const newText = prompt(`${STUDENTS[id]}의 새 다짐`, info.pledge || "");
          if (newText !== null) {
            set(ref(db, "students/" + id + "/pledge"), newText);
          }
        };

        right.appendChild(status);
        right.appendChild(timer);
        right.appendChild(edit);

        row.appendChild(left);
        row.appendChild(right);
        studentListDiv.appendChild(row);
      });

      updateEarthAndProgress(greenCount);
    }

    function updateEarthAndProgress(greenCount) {
      const total = Object.keys(STUDENTS).length;
      const half = Math.ceil(total / 2);

      if (greenCount >= half) {
        earthImage.src = "earth_happy.png";
        progressText.textContent = "우리 반 초록불 덕분에 땀나라가 시원해졌어요!";
        document.body.style.backgroundImage = 'url("bg_happy.png")';
      } else {
        earthImage.src = "earth_sad.png";
        progressText.textContent = "아직 아무도 시작하지 않았어요.";
        document.body.style.backgroundImage = 'url("bg_sad.png")';
      }

      summaryText.textContent = `${greenCount} / ${total} 명`;
      const percent = total > 0 ? (greenCount / total) * 100 : 0;
      progressFill.style.width = `${percent}%`;

      if (percent > 0 && percent < 50) {
        progressText.textContent = "좋아요, 조금씩 더 초록불을 켜 볼까요?";
      }
    }
  </script>

</body>
</html>
